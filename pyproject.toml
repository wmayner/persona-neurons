[project]
name = "persona-neurons"
version = "0.1.0"
description = "Role vectors of Qwen3-8B split into its MLP neurons, and steering with a role's top neurons"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # torch and transformers at the versions in the Assistant Axis repository's uv.lock. Its package (assistant_axis)
    # is imported from a checkout fetched at run time (persona_neurons.upstream), not installed.
    "torch==2.9.0",
    "transformers==4.57.5",
    "accelerate",
    "anthropic>=1",
    "openai",  # imported at module level by assistant_axis
    "plotly",  # imported at module level by assistant_axis
    "python-dotenv",  # imported at module level by assistant_axis
    "huggingface_hub",
    "jsonlines",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "seaborn",
    "tqdm",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["persona_neurons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
